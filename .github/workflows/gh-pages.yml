name: GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      actions: write
      checks: write
      contents: write
      pages: write
      id-token: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/utautts/go-src/UtauTTS/go.mod

      - name: Build UtauTTS WASM
        working-directory: src/utautts/go-src/UtauTTS
        run: |
          mkdir -p "$GITHUB_WORKSPACE/demo/utautts"
          GOOS=js GOARCH=wasm go build -trimpath -ldflags="-s -w" -o "$GITHUB_WORKSPACE/demo/utautts/utautts.wasm" ./cmd/utautts-wasm
          # Go 1.24+ ships wasm_exec.js under lib/wasm; earlier versions use misc/wasm.
          goroot="$(go env GOROOT)"
          if [ -f "$goroot/lib/wasm/wasm_exec.js" ]; then
            cp "$goroot/lib/wasm/wasm_exec.js" "$GITHUB_WORKSPACE/demo/utautts/wasm_exec.js"
          else
            cp "$goroot/misc/wasm/wasm_exec.js" "$GITHUB_WORKSPACE/demo/utautts/wasm_exec.js"
          fi

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/jpreprocess-wasm

      - name: Install wasm-bindgen-cli
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.128

      - name: Build jpreprocess WASM + naist-jdic dictionary
        working-directory: src/jpreprocess-wasm
        run: |
          set -e
          target=wasm32-unknown-unknown
          out="$GITHUB_WORKSPACE/demo/utautts/jpreprocess_wasm"
          # 1) `cargo check` with the bundled-dict feature runs jpreprocess-naist-jdic's
          #    build.rs, which downloads the prebuilt dictionary into target/.
          cargo check --release --target "$target" --features bundled-dict
          dict_dir="$(find "target/$target/release/build" -type d -path '*jpreprocess-naist-jdic-*/out/naist-jdic' | head -n 1)"
          test -f "$dict_dir/dict.da" || { echo "::error::naist-jdic dictionary not found under target/"; exit 1; }
          mkdir -p "$out/naist-jdic"
          for f in metadata.json char_def.bin matrix.mtx dict.da dict.vals unk.bin dict.wordsidx dict.words; do
            gzip -9 -c "$dict_dir/$f" > "$out/naist-jdic/$f.gz"
          done
          # 2) the dictionary-free wasm (~1.4MB) + JS glue
          cargo build --release --target "$target"
          wasm-bindgen "target/$target/release/jpreprocess_wasm.wasm" --out-dir "$out" --target web
          du -sh "$out" "$out/naist-jdic"

      - name: Build docs
        run: pnpm exec rimraf docs && pnpm exec typedoc src/index.ts --out docs

      - name: Build
        run: pnpm build

      - name: Copy demo files
        run: |
          mkdir -p docs/demo/world
          cp demo/index.html docs/demo/index.html
          cp dist/index.js docs/demo/index.js
          cp dist/koe-worklet.js docs/demo/koe-worklet.js
          cp -r dist/world/* docs/demo/world/
          mkdir -p docs/demo/utautts
          cp -r dist/utautts/* docs/demo/utautts/

      - name: Verify demo assets
        run: |
          set -e
          for f in \
            docs/demo/index.html \
            docs/demo/index.js \
            docs/demo/koe-worklet.js \
            docs/demo/world/worldline.wasm \
            docs/demo/utautts/utautts.wasm \
            docs/demo/utautts/wasm_exec.js \
            docs/demo/utautts/frame-intonation-v8.json             docs/demo/utautts/hts/tohoku-f01-neutral.htsvoice \
            docs/demo/utautts/jpreprocess_wasm/jpreprocess_wasm.js \
            docs/demo/utautts/jpreprocess_wasm/jpreprocess_wasm_bg.wasm \
            docs/demo/utautts/jpreprocess_wasm/naist-jdic/dict.da.gz \
            docs/demo/utautts/jpreprocess_wasm/naist-jdic/dict.words.gz \
            docs/demo/utautts/jpreprocess_wasm/naist-jdic/matrix.mtx.gz ; do
            test -s "$f" || { echo "::error::missing or empty demo asset: $f"; exit 1; }
          done
          du -sh docs docs/demo/utautts

      - name: Add .nojekyll
        run: touch ./docs/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: ./docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
