[package]
name = "jpreprocess-wasm"
version = "0.2.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# 従来通り naist-jdic を Wasm に同梱する (≈80MB)。既定では辞書を外部ファイルから読み込む。
bundled-dict = ["jpreprocess/naist-jdic"]

[dependencies]
wasm-bindgen = "0.2"
jpreprocess = { version = "0.15.0", default-features = false, features = ["tokenizer"] }
lindera-dictionary = { version = "3.0.7", default-features = false }
# HTS engine (Rust 移植)。音声モデルから音素長と F0 だけを取り出す (韻律の移植)。
jbonsai = "0.4.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
